<!doctype html><html><body><form>
<div class="eeo-section">
  <p>The following questions are entirely optional. To comply with government Equal Employment
  Opportunity and/or Affirmative Action reporting regulations...</p>

  <select id="resumator-eeo_race-value" name="resumator-eeo_race-value" class="form-control">
    <option value="0" selected="">Decline to answer</option>
    <option value="50">Hispanic or Latino</option>
    <option value="51">White, not Hispanic or Latino</option>
    <option value="52">Black or African-American, not Hispanic or Latino</option>
    <option value="53">Asian, not Hispanic or Latino</option>
    <option value="54">Native Hawaiian or Other Pacific Islander, not Hispanic or Latino</option>
    <option value="55">American Indian or Alaskan Native, not Hispanic or Latino</option>
    <option value="56">Two or More Races, not Hispanic or Latino</option>
    <option value="57">MENA (Middle Eastern and North African)</option>
  </select>

  <select id="resumator-eeo_gender-value" name="resumator-eeo_gender-value" class="form-control">
    <option value="0" selected="">Decline to answer</option>
    <option value="1">Male</option>
    <option value="2">Female</option>
  </select>

  <div>
    <input type="radio" id="resumator-eeo_veteran-value-1" name="resumator-eeo_veteran-value">
    <label for="resumator-eeo_veteran-value-1">I identify as one or more of the classifications of protected veteran listed above</label>
    <input type="radio" id="resumator-eeo_veteran-value-2" name="resumator-eeo_veteran-value">
    <label for="resumator-eeo_veteran-value-2">I am not a protected veteran</label>
    <input type="radio" id="resumator-eeo_veteran-value-3" name="resumator-eeo_veteran-value">
    <label for="resumator-eeo_veteran-value-3">I don't wish to answer</label>
  </div>

  <div>
    <input type="radio" id="resumator-eeo_disability-value-1" name="resumator-eeo_disability-value">
    <label for="resumator-eeo_disability-value-1">YES, I HAVE A DISABILITY, OR HAVE HAD ONE IN THE PAST</label>
    <input type="radio" id="resumator-eeo_disability-value-2" name="resumator-eeo_disability-value">
    <label for="resumator-eeo_disability-value-2">NO, I DO NOT HAVE A DISABILITY AND HAVE NOT HAD ONE IN THE PAST</label>
    <input type="radio" id="resumator-eeo_disability-value-3" name="resumator-eeo_disability-value">
    <label for="resumator-eeo_disability-value-3">I DO NOT WANT TO ANSWER</label>
  </div>
</div>
</form></body></html>
