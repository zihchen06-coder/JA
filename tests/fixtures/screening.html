<!doctype html><html><body><form>
<label for="gpa">Cumulative GPA</label><input id="gpa" name="gpa">
<label for="pn">Preferred Name</label><input id="pn" name="pn">
<label for="mi">Middle Initial</label><input id="mi" name="mi">
<label for="loc">Preferred Work Location</label><input id="loc" name="loc">
<label for="et">Employment Type</label><input id="et" name="et">
<fieldset><legend>Are you at least 18 years of age?</legend>
<input type="radio" id="a1" name="age" value="y"><label for="a1">Yes</label>
<input type="radio" id="a2" name="age" value="n"><label for="a2">No</label></fieldset>
<fieldset><legend>Do you have a valid driver's license?</legend>
<input type="radio" id="d1" name="dl" value="y"><label for="d1">Yes</label>
<input type="radio" id="d2" name="dl" value="n"><label for="d2">No</label></fieldset>
<fieldset><legend>Are you willing to submit to a background check?</legend>
<input type="radio" id="b1" name="bg" value="y"><label for="b1">Yes</label>
<input type="radio" id="b2" name="bg" value="n"><label for="b2">No</label></fieldset>
<fieldset><legend>Can you perform the essential functions of this job with or without reasonable accommodation?</legend>
<input type="radio" id="e1" name="ef" value="y"><label for="e1">Yes</label>
<input type="radio" id="e2" name="ef" value="n"><label for="e2">No</label></fieldset>
<fieldset><legend>Are you willing to travel?</legend>
<input type="radio" id="t1" name="tv" value="y"><label for="t1">Yes</label>
<input type="radio" id="t2" name="tv" value="n"><label for="t2">No</label></fieldset>
<fieldset><legend>Have you ever been convicted of a felony?</legend>
<input type="radio" id="c1" name="cv" value="y"><label for="c1">Yes</label>
<input type="radio" id="c2" name="cv" value="n"><label for="c2">No</label></fieldset>
<label for="sh">What is your current salary?</label><input id="sh" name="sh">
<label for="pe">Have you ever worked for this company before?</label><input id="pe" name="pe">
</form></body></html>
