<!doctype html>
<meta charset="utf-8">
<title>Routing saved answers</title>
<!--
  Four questions the alias table doesn't know, of the three kinds that
  behave differently once "route my saved answers" is on:

  * an ordinary screening radio, which needs no saved answer at all;
  * a disability self-ID group headed by a bland question, so the only
    mention of disability is in the choices -- the shape that slipped past a
    group-label-only filter;
  * a blanket terms checkbox and an SMS-consent checkbox, which may only
    ever be ticked from a consent answer the applicant set themselves.
-->
<body>
<form>
  <fieldset>
    <legend>Which shift are you available for?</legend>
    <input type="radio" id="s1" name="shift"><label for="s1">Day</label>
    <input type="radio" id="s2" name="shift"><label for="s2">Night</label>
    <input type="radio" id="s3" name="shift"><label for="s3">Either</label>
  </fieldset>

  <fieldset>
    <legend>Please check one of the boxes below:</legend>
    <input type="radio" id="d1" name="dis"><label for="d1">Yes, I have a disability, or have had one in the past</label>
    <input type="radio" id="d2" name="dis"><label for="d2">No, I do not have a disability and have not had one in the past</label>
    <input type="radio" id="d3" name="dis"><label for="d3">I do not want to answer</label>
  </fieldset>

  <label for="terms"><input type="checkbox" id="terms" name="terms"> I certify that the information given is true and complete</label>
  <label for="sms"><input type="checkbox" id="sms" name="sms"> I consent to receive SMS/text messages about my application</label>
</form>
</body>
