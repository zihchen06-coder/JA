<!doctype html><html><body>
<style>.select2-hidden-accessible { position: absolute !important; clip: rect(0 0 0 0) !important; width: 1px !important; height: 1px !important; overflow: hidden !important; }</style>
<div class="row form-group">
        <label for="region">State</label>
<select id="region" name="region" aria-required="true" class="select2-hidden-accessible" tabindex="-1" aria-hidden="true">
            <option value="" selected="">Choose</option>
            <option value="" selected="" disabled="">Choose</option>
            <option value="AL">Alabama</option>
            <option value="NY">New York</option>
            <option value="CA">California</option>
    </select>
</div>
</body></html>
