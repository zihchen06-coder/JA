<title>Campus screening questionnaire</title>
<!--
  A campus screening questionnaire from a real application, markup as it came
  off the page (the tool's own outlines dropped, the major list trimmed to
  three entries, and the applicant's typed answers cleared).

  Two things on this one page put the wrong answer in a box:

  1. "How many credit hours towards your degree do you anticipate having
     completed...?" contains the word "degree", so it matched the degree
     field and the applicant's "B.S." went into a box asking for a number.
     Refusing that alone was not enough -- it then fuzzy-matched *gpa*, and
     after that the machine-name fallback matched gpa again, off the field id
     "secondaryJsqData.Campus - GPA Not Required - Clearance - 2025.b", which
     is the questionnaire's name and not the field's.
  2. The GPA question offers brackets. No string match gets 3.7 into
     "3.5 or higher", so the numbers are read out and compared as numbers.

  The two yes/no questions are left for the applicant on purpose: neither
  "are you currently enrolled" nor a clearance held in the last 24 months is
  derivable from anything on the profile. They are what Learn this form is
  for -- answer once, press it, and they fill from then on.
-->
