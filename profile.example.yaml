# Free-form answers for recurring open-ended questions. The key is matched
# as a substring against the question's label (case-insensitive); the value
# is typed into the field verbatim, so tailor it before running a batch.
custom_answers:
  "why do you want to work here": "I'm excited about your product and mission."
  # Other phrasings worth having an answer ready for. Fill in and uncomment:
  # "why are you interested": ""
  # "what makes you a good fit": ""
  # "tell us about yourself": ""
  # "additional information": ""
  # "anything else you would like us to know": ""

# Voluntary self-identification (EEO). Filled ONLY from what you put here --
# never inferred from your name, resume, or anything else. Leave any of them
# blank and that question stays flagged for you to answer by hand.
# Use the exact wordings the forms use; the UI offers them as dropdowns.
gender: ""                 # Male | Female | Non-binary | Decline to self-identify
pronouns: ""               # e.g. he/him, she/her, they/them
hispanic_latino: ""        # Yes | No | Decline to self-identify
race_ethnicity: ""         # e.g. Asian | White | Black or African American | ...
veteran_status: ""         # I am not a protected veteran | I identify as one or more ... | I don't wish to answer
disability_status: ""      # Yes, I have a disability ... | No, I do not have a disability ... | I do not want to answer
sexual_orientation: ""
transgender_status: ""

# These are NEVER auto-filled, whatever you configure -- always flagged:
#   * criminal history (what may lawfully be asked varies by state and city)
#   * salary history (illegal for employers to ask in many states)
