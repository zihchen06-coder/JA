<!doctype html><html><body><form>
<label for="dl">Do you have a valid driver's license?*</label>
<select id="dl" name="dl"><option>No answer</option><option>Yes</option><option>No</option></select>

<label for="ce">What's your citizenship / employment eligibility?*</label>
<select id="ce" name="ce"><option>No answer</option><option>U.S. Citizen</option><option>Permanent Resident</option>
<option>Authorized to work in the U.S. without sponsorship</option><option>Will require visa sponsorship</option></select>

<label for="ed">What's your highest level of education completed?*</label>
<select id="ed" name="ed"><option>No answer</option><option>High School Diploma / GED</option>
<option>Associate's Degree</option><option>Bachelor's Degree</option><option>Master's Degree</option></select>

<label for="ov18">Are you 18 years of age or older?*</label>
<select id="ov18" name="ov18"><option>No answer</option><option>Yes</option><option>No</option></select>

<label for="ref">Who referred you to this position? Enter their first and last name here.</label>
<input id="ref" name="ref">

<label for="ot">Are you willing to work overtime and/or varied schedules due to workload?*</label>
<select id="ot" name="ot"><option>-- No answer --</option><option>Yes</option><option>No</option></select>

<label for="tr">Do you have access to adequate transportation for work?*</label>
<select id="tr" name="tr"><option>-- No answer --</option><option>Yes</option><option>No</option></select>

<label for="rel">I have read the location where this position is based and I am either a local candidate or I am
willing to relocate for this position.*</label>
<select id="rel" name="rel"><option>-- No answer --</option><option>Yes</option><option>No</option></select>

<label for="sp">Will you now or in the future require sponsorship for employment visa status (e.g. H1-B status)?*</label>
<select id="sp" name="sp"><option>-- No answer --</option><option>Yes</option><option>No</option></select>

<div>
  <p>I confirm that I am eligible to live and work in the United States.*</p>
  <input type="radio" id="e1" name="elig"><label for="e1">Yes</label>
  <input type="radio" id="e2" name="elig"><label for="e2">No</label>
</div>

<label for="nc">Are you currently bound by a Non-Competition, Non-Solicitation Agreement with your current employer?*</label>
<select id="nc" name="nc"><option>-- No answer --</option><option>Yes</option><option>No</option></select>

<label for="aec">Do you have 5+ years of experience in the AEC industry?*</label>
<select id="aec" name="aec"><option>-- No answer --</option><option>Yes</option><option>No</option></select>

<label for="grp">Which of the following groups at LDG are you most interested in learning more about?*</label>
<select id="grp" name="grp"><option>-- No answer --</option><option>Water</option><option>Transportation</option></select>

<label for="g">Gender</label>
<select id="g" name="g"><option>Decline to answer</option><option>Male</option><option>Female</option></select>

<div>
  <p>Veteran status</p>
  <input type="radio" id="v1" name="vet"><label for="v1">I IDENTIFY AS ONE OR MORE OF THE CLASSIFICATIONS OF PROTECTED VETERAN LISTED ABOVE</label>
  <input type="radio" id="v2" name="vet"><label for="v2">I AM NOT A PROTECTED VETERAN</label>
  <input type="radio" id="v3" name="vet"><label for="v3">I DON'T WISH TO ANSWER</label>
</div>

<div>
  <p>Please check one of the boxes below:</p>
  <input type="radio" id="d1" name="dis"><label for="d1">YES, I HAVE A DISABILITY, OR HAVE HAD ONE IN THE PAST</label>
  <input type="radio" id="d2" name="dis"><label for="d2">NO, I DO NOT HAVE A DISABILITY AND HAVE NOT HAD ONE IN THE PAST</label>
  <input type="radio" id="d3" name="dis"><label for="d3">I DO NOT WANT TO ANSWER</label>
</div>

<label for="nm">Name</label><input id="nm" name="nm">
<label for="dt">Date</label><input id="dt" name="dt">
<label for="sms"><input type="checkbox" id="sms" name="sms"> I consent to receive SMS/text messages regarding my job application</label>
</form></body></html>
