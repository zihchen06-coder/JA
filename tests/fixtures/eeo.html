<!doctype html><html><body><form>
<label for="g">Gender</label>
<select id="g" name="g"><option value="">Select...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select>
<label for="r">Race / Ethnicity</label>
<select id="r" name="r"><option value="">Select...</option><option>Asian</option><option>White</option><option>Black or African American</option><option>Decline to self-identify</option></select>
<label for="hl">Are you Hispanic or Latino?</label>
<select id="hl" name="hl"><option value="">Select...</option><option>Yes</option><option>No</option></select>
<label for="pr">Preferred Pronouns</label><input id="pr" name="pr">
<div>
  <p>Veteran Status</p>
  <input type="radio" id="v1" name="vet"><label for="v1">I am not a protected veteran</label>
  <input type="radio" id="v2" name="vet"><label for="v2">I identify as one or more of the classifications of a protected veteran</label>
  <input type="radio" id="v3" name="vet"><label for="v3">I don't wish to answer</label>
</div>
<div>
  <p>Disability Status</p>
  <input type="radio" id="d1" name="dis"><label for="d1">Yes, I have a disability, or have had one in the past</label>
  <input type="radio" id="d2" name="dis"><label for="d2">No, I do not have a disability and have not had one in the past</label>
  <input type="radio" id="d3" name="dis"><label for="d3">I do not want to answer</label>
</div>
<label for="cv">Have you ever been convicted of a felony?</label><input id="cv" name="cv">
</form></body></html>
